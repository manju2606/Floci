<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Kubernetes — Floci Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Amazon Ember","Helvetica Neue",Arial,sans-serif;background:#f2f3f3;color:#16191f;min-height:100vh}

    header{background:#232f3e;padding:12px 32px;display:flex;align-items:center;justify-content:space-between}
    header .logo{font-size:22px;font-weight:700;color:#ff9900}
    header .subtitle{font-size:13px;color:#aab7b8;margin-top:2px}
    header a.back{font-size:13px;color:#aab7b8;text-decoration:none;border:1px solid #4a5568;padding:5px 14px;border-radius:3px}
    header a.back:hover{color:#fff;border-color:#fff}

    .hero{background:linear-gradient(135deg,#1a2332,#2d3a4a);padding:28px 32px;display:flex;align-items:center;gap:20px}
    .hero-icon{font-size:32px;background:#326ce5;width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .hero h1{font-size:22px;font-weight:700;color:#fff}
    .hero p{font-size:13px;color:#aab7b8;margin-top:4px}
    .hero .refresh-btn{margin-left:auto;padding:8px 18px;background:#326ce5;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
    .hero .refresh-btn:hover{background:#2554c7}

    main{max-width:1200px;margin:28px auto;padding:0 24px}

    /* Cluster tabs */
    .cluster-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .cluster-tab{padding:8px 16px;border-radius:4px;border:1px solid #d5dbdb;background:#fff;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;transition:all .15s}
    .cluster-tab:hover{border-color:#326ce5;color:#326ce5}
    .cluster-tab.active{background:#326ce5;color:#fff;border-color:#326ce5}
    .cluster-tab.offline{border-color:#e8a09e;color:#922b21;background:#fff}
    .cluster-tab.offline.active{background:#c0392b;border-color:#c0392b;color:#fff}
    .cluster-tab .dot{width:8px;height:8px;border-radius:50%;background:#27ae60;flex-shrink:0}
    .cluster-tab.offline .dot{background:#e74c3c}
    .cluster-tab .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.2);font-weight:400}

    /* Cluster panel */
    .cluster-panel{display:none}
    .cluster-panel.active{display:block}

    /* Cluster info bar */
    .cluster-info{background:#fff;border:1px solid #d5dbdb;border-radius:4px;padding:16px 24px;margin-bottom:20px}
    .cluster-info h2{font-size:14px;font-weight:600;margin-bottom:12px;color:#545b64;text-transform:uppercase;letter-spacing:.5px}
    .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .info-item .key{font-size:11px;color:#687078;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
    .info-item .val{font-size:14px;font-weight:600;color:#16191f}

    /* Stats */
    .stat-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .stat-card{background:#fff;border:1px solid #d5dbdb;border-radius:4px;padding:12px 20px;flex:1;min-width:110px;text-align:center}
    .stat-card .num{font-size:26px;font-weight:700;color:#326ce5}
    .stat-card .lbl{font-size:11px;color:#687078;margin-top:2px}

    /* Sections */
    .section{margin-bottom:20px}
    .section h3{font-size:14px;font-weight:600;color:#16191f;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #d5dbdb;display:flex;align-items:center;gap:6px}
    .section h3 .badge{font-size:10px;background:#326ce5;color:#fff;padding:1px 7px;border-radius:10px}

    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d5dbdb;border-radius:4px;overflow:hidden;font-size:12.5px}
    th{background:#f2f3f3;padding:8px 12px;text-align:left;font-weight:600;color:#545b64;border-bottom:1px solid #d5dbdb}
    td{padding:8px 12px;border-bottom:1px solid #eaeded}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#fafafa}

    .bg{background:#d5f5e3;color:#1e8449;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
    .by{background:#fef9e7;color:#b7950b;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
    .br{background:#fadbd8;color:#922b21;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
    .bk{background:#eaeded;color:#545b64;padding:2px 7px;border-radius:10px;font-size:11px}

    .loading{color:#687078;font-size:13px;padding:20px;text-align:center}
    .offline-msg{background:#fdf3e3;border:1px solid #f5cba7;border-left:4px solid #e67e22;border-radius:4px;padding:14px 18px;font-size:13px;color:#784212}
    .error-box{background:#fadbd8;border:1px solid #f1948a;border-radius:4px;padding:12px 16px;font-size:13px;color:#922b21;margin-bottom:16px}

    footer{text-align:center;padding:28px;font-size:12px;color:#aab7b8}
  </style>
</head>
<body>

<header>
  <div><div class="logo">&#9830; Floci</div><div class="subtitle">Local AWS Emulator</div></div>
  <a class="back" href="index.html">&#8592; Dashboard</a>
</header>

<div class="hero">
  <div class="hero-icon">&#9096;</div>
  <div>
    <h1>Kubernetes</h1>
    <p id="cluster-count">Loading clusters...</p>
  </div>
  <button class="refresh-btn" onclick="init()">&#8635; Refresh</button>
</div>

<main>
  <div id="error-box"></div>
  <div class="cluster-tabs" id="cluster-tabs"></div>
  <div id="cluster-panels"></div>
</main>

<footer>Floci &mdash; Local AWS Emulator &mdash; Always Free</footer>

<script>
function age(ts) {
  if (!ts) return '—';
  const s = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function badge(s) {
  if (!s) return `<span class="bk">—</span>`;
  const l = s.toLowerCase();
  if (['running','ready','active','true'].includes(l)) return `<span class="bg">${s}</span>`;
  if (['pending','containercreating','crashloopbackoff'].includes(l)) return `<span class="by">${s}</span>`;
  return `<span class="br">${s}</span>`;
}

async function apiFetch(path) {
  const r = await fetch(path);
  if (!r.ok) { const e = await r.json(); throw new Error(e.error || r.statusText); }
  return r.json();
}

function clusterTag(name) {
  if (name.includes('aks')) return 'AKS';
  if (name.includes('eks') || name.includes('arn:aws')) return 'EKS';
  if (name.includes('kind')) return 'Kind';
  if (name.includes('docker-desktop')) return 'Docker';
  return 'K8s';
}

function renderNodes(items) {
  if (!items?.length) return '<p class="loading">No nodes</p>';
  const rows = items.map(n => {
    const ready = n.status.conditions?.find(c=>c.type==='Ready')?.status==='True' ? 'Ready' : 'NotReady';
    return `<tr>
      <td>${n.metadata.name}</td>
      <td>${n.metadata.labels?.['node-role.kubernetes.io/control-plane']!==undefined?'control-plane':'worker'}</td>
      <td>${badge(ready)}</td>
      <td>${n.status.capacity?.cpu||'—'}</td>
      <td>${n.status.capacity?.memory||'—'}</td>
      <td>${n.status.nodeInfo?.kubeletVersion||'—'}</td>
      <td>${age(n.metadata.creationTimestamp)}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>CPU</th><th>Memory</th><th>Version</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderPods(items) {
  if (!items?.length) return '<p class="loading">No pods</p>';
  const rows = items.map(p => `<tr>
    <td>${p.metadata.name}</td>
    <td><span class="bk">${p.metadata.namespace}</span></td>
    <td>${badge(p.status.phase)}</td>
    <td>${(p.status.containerStatuses?.filter(c=>c.ready).length||0)}/${p.spec.containers?.length||0}</td>
    <td>${p.status.containerStatuses?.reduce((a,c)=>a+c.restartCount,0)||0}</td>
    <td>${p.spec.nodeName||'—'}</td>
    <td>${age(p.metadata.creationTimestamp)}</td>
  </tr>`).join('');
  return `<table><thead><tr><th>Name</th><th>Namespace</th><th>Status</th><th>Ready</th><th>Restarts</th><th>Node</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderDeployments(items) {
  if (!items?.length) return '<p class="loading">No deployments</p>';
  const rows = items.map(d => `<tr>
    <td>${d.metadata.name}</td>
    <td><span class="bk">${d.metadata.namespace}</span></td>
    <td>${badge(d.status.readyReplicas===d.spec.replicas?'Ready':'Pending')}</td>
    <td>${d.status.readyReplicas||0}/${d.spec.replicas||0}</td>
    <td>${age(d.metadata.creationTimestamp)}</td>
  </tr>`).join('');
  return `<table><thead><tr><th>Name</th><th>Namespace</th><th>Status</th><th>Ready</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderServices(items) {
  if (!items?.length) return '<p class="loading">No services</p>';
  const rows = items.map(s => `<tr>
    <td>${s.metadata.name}</td>
    <td><span class="bk">${s.metadata.namespace}</span></td>
    <td>${s.spec.type}</td>
    <td>${s.spec.clusterIP}</td>
    <td>${s.spec.ports?.map(p=>`${p.port}${p.nodePort?':'+p.nodePort:''}`).join(', ')||'—'}</td>
    <td>${age(s.metadata.creationTimestamp)}</td>
  </tr>`).join('');
  return `<table><thead><tr><th>Name</th><th>Namespace</th><th>Type</th><th>Cluster-IP</th><th>Ports</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderNamespaces(items) {
  if (!items?.length) return '<p class="loading">No namespaces</p>';
  const rows = items.map(n => `<tr>
    <td>${n.metadata.name}</td>
    <td>${badge(n.status.phase)}</td>
    <td>${age(n.metadata.creationTimestamp)}</td>
  </tr>`).join('');
  return `<table><thead><tr><th>Name</th><th>Status</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function section(title, id, content) {
  return `<div class="section">
    <h3>${title} <span class="badge" id="${id}-badge">—</span></h3>
    <div id="${id}">${content}</div>
  </div>`;
}

async function loadCluster(ctx, panelId) {
  const panel = document.getElementById(panelId);
  const enc = encodeURIComponent(ctx.name);

  // Load all resources in parallel
  const [ver, nodes, pods, deps, svcs, nss] = await Promise.allSettled([
    apiFetch(`/api/cluster/${enc}/version`),
    apiFetch(`/api/cluster/${enc}/nodes`),
    apiFetch(`/api/cluster/${enc}/pods`),
    apiFetch(`/api/cluster/${enc}/deployments`),
    apiFetch(`/api/cluster/${enc}/services`),
    apiFetch(`/api/cluster/${enc}/namespaces`),
  ]);

  if (nodes.status === 'rejected') {
    panel.innerHTML = `<div class="offline-msg">
      &#9888; <strong>Cannot connect to cluster</strong><br/>
      ${nodes.reason?.message || 'Cluster may require cloud authentication (AKS/EKS) or may be offline.'}
    </div>`;
    document.querySelector(`[data-ctx="${CSS.escape(ctx.name)}"]`)?.classList.add('offline');
    return;
  }

  // Cluster info
  const v = ver.value || {};
  const clusterInfo = `<div class="cluster-info">
    <h2>Cluster Info</h2>
    <div class="info-grid">
      <div class="info-item"><div class="key">Cluster</div><div class="val">${ctx.cluster}</div></div>
      <div class="info-item"><div class="key">Version</div><div class="val">${v.gitVersion||'—'}</div></div>
      <div class="info-item"><div class="key">Platform</div><div class="val">${v.platform||v.goOs||'—'}</div></div>
      <div class="info-item"><div class="key">Go Version</div><div class="val">${v.goVersion||'—'}</div></div>
      <div class="info-item"><div class="key">Build Date</div><div class="val">${(v.buildDate||'').split('T')[0]||'—'}</div></div>
    </div>
  </div>`;

  const nodeItems = nodes.value?.items || [];
  const podItems  = pods.value?.items  || [];
  const depItems  = deps.value?.items  || [];
  const svcItems  = svcs.value?.items  || [];
  const nsItems   = nss.value?.items   || [];

  const stats = `<div class="stat-bar">
    <div class="stat-card"><div class="num">${nodeItems.length}</div><div class="lbl">Nodes</div></div>
    <div class="stat-card"><div class="num">${podItems.length}</div><div class="lbl">Pods</div></div>
    <div class="stat-card"><div class="num">${depItems.length}</div><div class="lbl">Deployments</div></div>
    <div class="stat-card"><div class="num">${svcItems.length}</div><div class="lbl">Services</div></div>
    <div class="stat-card"><div class="num">${nsItems.length}</div><div class="lbl">Namespaces</div></div>
  </div>`;

  panel.innerHTML = clusterInfo + stats +
    section('&#128196; Nodes',       `${panelId}-nodes`,       renderNodes(nodeItems)) +
    section('&#128230; Pods',        `${panelId}-pods`,        renderPods(podItems)) +
    section('&#9881; Deployments',   `${panelId}-deployments`, renderDeployments(depItems)) +
    section('&#127760; Services',    `${panelId}-services`,    renderServices(svcItems)) +
    section('&#128193; Namespaces',  `${panelId}-namespaces',  renderNamespaces(nsItems));

  // Update badges
  [[`${panelId}-nodes`,nodeItems],[`${panelId}-pods`,podItems],[`${panelId}-deployments`,depItems],
   [`${panelId}-services`,svcItems],[`${panelId}-namespaces`,nsItems]]
    .forEach(([id,items]) => { const b = document.getElementById(id+'-badge'); if(b) b.textContent=items.length; });
}

let allContexts = [];

async function init() {
  try {
    const data = await apiFetch('/api/contexts');
    allContexts = data.contexts;
    document.getElementById('cluster-count').textContent =
      `${allContexts.length} cluster${allContexts.length!==1?'s':''} configured`;

    const tabsEl   = document.getElementById('cluster-tabs');
    const panelsEl = document.getElementById('cluster-panels');
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = '';

    allContexts.forEach((ctx, i) => {
      const panelId = `panel-${i}`;
      const tag = clusterTag(ctx.name);

      const tab = document.createElement('div');
      tab.className = 'cluster-tab' + (i===0?' active':'');
      tab.dataset.ctx = ctx.name;
      tab.innerHTML = `<span class="dot"></span>${ctx.name.length>35?ctx.name.slice(0,33)+'…':ctx.name}<span class="tag">${tag}</span>`;
      tab.onclick = () => {
        document.querySelectorAll('.cluster-tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.cluster-panel').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(panelId).classList.add('active');
      };
      tabsEl.appendChild(tab);

      const panel = document.createElement('div');
      panel.id = panelId;
      panel.className = 'cluster-panel' + (i===0?' active':'');
      panel.innerHTML = '<div class="loading">Connecting to cluster...</div>';
      panelsEl.appendChild(panel);

      loadCluster(ctx, panelId);
    });
  } catch(e) {
    document.getElementById('error-box').innerHTML =
      `<div class="error-box">&#9888; Backend not reachable: ${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
