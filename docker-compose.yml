services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  k8s-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ${USERPROFILE}/.kube:/root/.kube:ro
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - k8s-backend

  dynamoui:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - floci

  k8s-agent:
    build: ./k8s-agent
    ports:
      - "8002:8001"
    volumes:
      - ${USERPROFILE}/.kube:/root/.kube:ro
    depends_on:
      - dashboard

  s3ui:
    image: cloudlena/s3manager
    ports:
      - "8333:8080"
    environment:
      - ENDPOINT=floci:4566
      - ACCESS_KEY_ID=test
      - SECRET_ACCESS_KEY=test
      - USE_SSL=false
      - FORCE_PATH_STYLE=true