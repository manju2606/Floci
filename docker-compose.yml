services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack-data:/var/lib/localstack
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_VOLUME_DIR=/var/lib/localstack

  k8s-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ${USERPROFILE}/.kube:/root/.kube:rw
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - k8s-backend

  dynamoui:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - floci

  k8s-agent:
    build: ./k8s-agent
    ports:
      - "8002:8001"
    volumes:
      - ${USERPROFILE}/.kube:/root/.kube:ro
    depends_on:
      - dashboard

  s3ui:
    image: cloudlena/s3manager
    ports:
      - "8333:8080"
    environment:
      - ENDPOINT=floci:4566
      - ACCESS_KEY_ID=test
      - SECRET_ACCESS_KEY=test
      - USE_SSL=false
      - FORCE_PATH_STYLE=true

  # ── Data services ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=mydb
    volumes:
      - mongo-data:/data/db

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      - mysql
      - postgres

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8084:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=root
      - ME_CONFIG_MONGODB_URL=mongodb://root:root@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb

  retail-proxy:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/retail-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - kind

networks:
  kind:
    external: true

volumes:
  localstack-data:
  mysql-data:
  postgres-data:
  redis-data:
  mongo-data: